<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="facebook-domain-verification" content="8abclnki7hccmjsxrln0lfuh29i972" />
  <title>Login | Meta Ads Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
  <style>
    body { display:flex; align-items:center; justify-content:center; padding:20px; }
    .connect-screen { position:relative; display:flex; background:none; z-index:10; }
    /* ── Facebook OAuth Loading Overlay ── */
    .fb-loading{position:fixed;inset:0;background:rgba(7,11,19,0.92);backdrop-filter:blur(8px);z-index:99999;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;}
    .fb-loading.show{display:flex;}
    .fb-spinner{width:48px;height:48px;border:3px solid rgba(24,119,242,0.2);border-top-color:#1877F2;border-radius:50%;animation:fbspin 0.8s linear infinite;}
    @keyframes fbspin{to{transform:rotate(360deg)}}
    .fb-loading-text{font-size:14px;color:#546882;font-family:'Inter',sans-serif;}
    /* ── User Cards ── */
    .user-card{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--bg-2);border:1.5px solid var(--border-md);border-radius:10px;cursor:pointer;transition:all 0.18s;}
    .user-card:hover{border-color:var(--fb);background:var(--bg-3);transform:translateY(-1px);}
    .user-card-active{border-color:rgba(24,119,242,0.5);background:rgba(24,119,242,0.07);}
    .user-card-avatar{position:relative;flex-shrink:0;}
    .user-card-initials{width:36px;height:36px;border-radius:50%;background:var(--fb-dim);color:var(--fb);font-weight:700;font-size:15px;align-items:center;justify-content:center;}
    .user-card-info{flex:1;min-width:0;}
    .user-card-name{font-size:13.5px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .user-card-sub{font-size:10.5px;color:var(--muted);margin-top:1px;}
    .user-card-remove{background:transparent;border:none;color:var(--dim);cursor:pointer;padding:4px 6px;border-radius:5px;font-size:13px;transition:all 0.15s;line-height:1;}
    .user-card-remove:hover{background:rgba(239,83,80,0.12);color:var(--red);}
    .connect-btn-secondary{display:inline-flex;align-items:center;gap:8px;padding:9px 20px;background:transparent;border:1.5px solid var(--border-md);border-radius:99px;color:var(--text-2);font-family:var(--ff-ui);font-size:13px;font-weight:600;cursor:pointer;transition:all 0.18s;}
    .connect-btn-secondary:hover{border-color:var(--fb);color:var(--fb);background:var(--fb-dim);}
  </style>
</head>
<body>

<!-- Facebook OAuth Loading Overlay -->
<div class="fb-loading" id="fbLoading">
  <div class="fb-spinner"></div>
  <div class="fb-loading-text" id="fbLoadingText">Facebook-ல் login ஆகுது...</div>
</div>

<!-- CONNECT SCREEN -->
<div class="connect-screen" id="connectScreen">
  <div class="connect-box">
    <div class="connect-logo-wrap">
      <div class="connect-logo-mark"><img src="logo.png" alt="Sm"/></div>
    </div>
    <div class="connect-title">Meta Ads Intelligence</div>
    <div class="connect-sub">உங்கள் real-time ad data — instant connect</div>

    <!-- ── Saved Users Picker ── -->
    <div id="userPickerSection" style="display:none; margin-bottom:4px;"></div>

    <!-- ── Facebook OAuth ── -->
    <div id="fbSection" style="text-align:center;padding:10px 0 20px;">
      <p style="font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.6;">
        Facebook button click பண்ணினால் automatically உங்கள் account-க்கு login ஆகி
        எல்லா Ad Accounts-ம் auto detect ஆகும்.
      </p>
      <button class="connect-btn" id="fbOAuthBtn" onclick="startFBOAuth()" style="margin-bottom:12px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="white" style="flex-shrink:0;">
          <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
        </svg>
        <span id="fbOAuthBtnText">Continue with Facebook →</span>
      </button>
    </div>

    <div class="connect-err" id="connectErr" style="margin-top:12px;"></div>
  </div>
</div>

<div class="noise"></div>
<script src="login.js"></script>
</body>
</html>
